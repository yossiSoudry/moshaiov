name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare Workers
        run: npm run cf:build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_BRAINERCE_SALES_CHANNEL_ID: ${{ vars.NEXT_PUBLIC_BRAINERCE_SALES_CHANNEL_ID }}
          NEXT_PUBLIC_BRAINERCE_CONNECTION_ID: ${{ vars.NEXT_PUBLIC_BRAINERCE_CONNECTION_ID }}
          NEXT_PUBLIC_BRAINERCE_API_URL: ${{ vars.NEXT_PUBLIC_BRAINERCE_API_URL }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
